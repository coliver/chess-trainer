# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more about the API, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# Be aware that YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"
#
# Almost all UI copy now lives in packages/i18n-locales/locales/en-US.json,
# the single source of truth shared with React (see
# config/initializers/i18n_json_loader.rb, which transforms it into this
# locale's I18n.load_path at boot). Only strings with no React equivalent —
# because the concept doesn't exist on that side, or because the flow is
# structurally different (e.g. a full-page flash-redirect vs React's inline
# optimistic UI) — stay here.

"en-US":
  puzzles:
    controller:
      could_not_load: "Could not load puzzle"

  sessions:
    controller:
      verification_sent: "If that account exists and is unverified, a verification email has been sent."
      resend_failed: "Something went wrong"

  registrations:
