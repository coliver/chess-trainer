      title: "Check your email"
      subtitle: "We sent a verification link to"

  errors:
    api_down:
      title: "Server unavailable"
      subtitle: "Knight School's server is temporarily unreachable. Please try again shortly."
      try_again: "Try again"

  dashboard:
    show:
      welcome_back: "Welcome back"
    search_results:
      no_match_html: "No openings match &ldquo;%{query}&rdquo;."
      search_hint: "Try a name (Sicilian) or an ECO code (B90)."
      show_more: "Show %{count} more"

  settings:
    controller:
      preferences_saved: "Preferences saved."
      save_failed: "Couldn't save preferences"

  trainings:
    show:
      your_move_status: "Your move"
    controller:
      could_not_load: "Could not load training session"
      could_not_start: "Could not start training session"
      default_opening_name: "Training"
      illegal_move: "Illegal move"
      session_completed: "Session completed."
      opening_complete: "Opening complete."
      no_more_moves: "No more moves in this session or session expired."
