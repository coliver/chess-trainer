name: angular

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  angular:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: angular

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: angular/package-lock.json

      # Clean, reproducible install straight from the lockfile.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx ng lint

      - name: Build
        run: npx ng build

      - name: Unit tests (headless Chrome)
        run: npx ng test --watch=false --browsers=ChromeHeadlessNoSandbox
