# .github/workflows/deploy.yml
name: Deploy to prod
on:
  push:
    branches: [main]
  workflow_dispatch: {}
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to knightschool.click
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" bash -s <<'EOF'
            set -euo pipefail
            cd /home/ec2-user/chess-trainer

            git fetch origin main
            git reset --hard origin/main

            # Host has no Node installed; build the frontend/chess-core
            # bundles with a throwaway node container instead.
            docker run --rm -v "$(pwd)":/work -w /work/packages/chess-core node:20 \
              sh -c 'npm ci && npm run build'
            docker run --rm -v "$(pwd)":/work -w /work/react node:20 \
              sh -c 'npm ci && npm run build'

            docker compose -f docker-compose.yml -f docker-compose.prod.yml \
              up -d --build db api nginx

            docker image prune -f
          EOF
