# .github/workflows/deploy.yml
name: Deploy to prod
on:
  push:
    branches: [main]
  workflow_dispatch: {}
jobs:
  core:
    uses: ./.github/workflows/core.yml
  react:
    uses: ./.github/workflows/react.yml
  tests:
    uses: ./.github/workflows/tests.yml
  rails:
    uses: ./.github/workflows/rails.yml

  deploy:
    needs: [core, react, tests, rails]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to knightschool.click
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" bash -s <<'EOF'
            set -euo pipefail
            cd /home/ec2-user/chess-trainer

            git fetch origin main --tags
            git reset --hard origin/main

            APP_VERSION="$(git describe --tags --always)"

            # .env lives on the host (gitignored, provisioned by hand) and is
            # auto-loaded by `docker compose` for its own interpolation, but
            # this build step shells out to a bare node container instead —
            # source it here so VITE_SENTRY_DSN reaches that container too.
            set -a
            [ -f .env ] && source .env
            set +a

            # Host has no Node installed; build the frontend/chess-core
            # bundles with a throwaway node container instead.
            docker run --rm -v "$(pwd)":/work -w /work/frontend/packages/chess-core node:20 \
              sh -c 'npm ci && npm run build'
            docker run --rm -v "$(pwd)":/work -w /work/frontend/react \
              -e VITE_APP_VERSION="$APP_VERSION" \
              -e VITE_SENTRY_DSN="${VITE_SENTRY_DSN:-}" \
              -e VITE_SENTRY_ENVIRONMENT=production \
              node:20 sh -c 'npm ci && npm run build'

            # --renew-anon-volumes: rails/angular mount an anonymous volume
            # over /app/node_modules to keep container deps isolated from
            # the host bind-mount (see docker-compose.yml). Without this
            # flag, `up -d --build` reuses that volume's content from the
            # PREVIOUS container even when the freshly built image would
            # have different node_modules — e.g. a newly added npm
            # dependency stays invisible at runtime until the volume itself
            # is recreated, no matter how many times the image is rebuilt.
            docker compose -f docker-compose.yml -f docker-compose.prod.yml \
              up -d --build --renew-anon-volumes db api rails nginx

            # nginx's config is a bind-mounted directory (nginx/conf-prod),
            # so `up -d` won't recreate the nginx container just because a
            # .conf file's contents changed underneath it — the running
            # worker keeps serving whatever config it loaded at last start
            # or reload. Reload explicitly so config-only changes (new
            # location blocks, etc.) actually take effect on every deploy.
            docker compose -f docker-compose.yml -f docker-compose.prod.yml \
              exec -T nginx nginx -s reload

            # Aggressive cleanup: every deploy rebuilds the api image via
            # BuildKit, and `docker image prune -f` alone only removes
            # dangling (untagged) images, so BuildKit's layer cache and any
            # stale-but-tagged images (e.g. an old chess-trainer-react build
            # that isn't started in prod) accumulate unbounded across
            # deploys and previously filled the disk (ENOSPC on 2026-08-17).
            docker builder prune -af
            docker image prune -af
          EOF
