# .github/workflows/deploy.yml
name: Deploy to prod
on:
  push:
    branches: [main]
  workflow_dispatch: {}
jobs:
  core:
    uses: ./.github/workflows/core.yml
  react:
    uses: ./.github/workflows/react.yml
  tests:
    uses: ./.github/workflows/tests.yml
  rails:
    uses: ./.github/workflows/rails.yml
  angular:
    uses: ./.github/workflows/angular.yml

  deploy:
    needs: [core, react, tests, rails, angular]
    # Back-to-back merges must queue: two deploys at once run npm ci in the
    # same checkout on the box and corrupt each other's node_modules.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::350779560597:role/knightschool-github-deploy
          aws-region: us-east-1

      - name: Deploy to knightschool.click via SSM
        env:
          INSTANCE_ID: i-07ae4f30893bced86
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy chess-trainer ${{ github.sha }}" \
            --parameters 'commands=["sudo -u ec2-user -H bash -c \"cd /home/ec2-user/chess-trainer && git fetch origin main --tags && git reset --hard origin/main && bash scripts/deploy.sh\""]' \
            --query "Command.CommandId" --output text)

          echo "SSM command: $COMMAND_ID"

          # The built-in waiter gives up after ~100s; the deploy takes minutes.
          # Poll up to 30 min instead.
          for _ in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "Status" --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Pending|InProgress|Delayed) sleep 15 ;;
              *) break ;;
            esac
          done
          echo "--- stdout ---"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardOutputContent" --output text
          echo "--- stderr ---"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardErrorContent" --output text

          if [ "$STATUS" != "Success" ]; then
            echo "Deploy failed with status: $STATUS"
            exit 1
          fi
