name: react

on:
  pull_request:
    branches: [main]
  workflow_call: {}

jobs:
  react:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: react/package-lock.json

      # React depends on @knight-school/chess-core via file:../packages/chess-core,
      # so build the package first (its own isolated install + tsup build).
      - name: Build chess-core package
        working-directory: packages/chess-core
        run: npm ci && npm run build

      # Clean, reproducible install straight from the lockfile.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit / component tests
        run: npx vitest run
