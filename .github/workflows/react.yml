name: react

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  react:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: react/package-lock.json

      # Clean, reproducible install straight from the lockfile.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit / component tests
        run: npx vitest run
