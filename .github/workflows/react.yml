name: react

on:
  pull_request:
    branches: [main]
  workflow_call: {}

jobs:
  react:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: react/package-lock.json

      # React depends on @knight-school/chess-core via file:../packages/chess-core,
      # so build the package first (its own isolated install + tsup build).
      - name: Build chess-core package
        working-directory: packages/chess-core
        run: npm ci && npm run build

      # Clean, reproducible install straight from the lockfile.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit / component tests
        run: npx vitest run

      - name: Get installed Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # The cache only stores the browser binaries, not the apt packages
      # --with-deps installs; those are needed every run regardless of cache
      # hit, but are cheap/no-op if already present on the runner image.
      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: E2E tests (Playwright)
        run: npx playwright test
