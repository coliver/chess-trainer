name: core

on:
  pull_request:
    branches: [main]
  workflow_call: {}

jobs:
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/packages/chess-core

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/packages/chess-core/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (tsup -> dist ESM + d.ts)
        run: npm run build

      - name: Unit tests (real chess.js)
        run: npm test
