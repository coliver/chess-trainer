name: core

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/chess-core

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/chess-core/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (tsup -> dist ESM + d.ts)
        run: npm run build

      - name: Unit tests (real chess.js)
        run: npm test
