version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
  - package-ecosystem: "npm"
    directory: "/frontend/react"
    schedule:
      interval: "daily"
  - package-ecosystem: "npm"
    directory: "/frontend/angular"
    schedule:
      interval: "daily"
  - package-ecosystem: "npm"
    directory: "/frontend/rails"
    schedule:
      interval: "daily"
  - package-ecosystem: "npm"
    directory: "/frontend/packages/chess-core"
    schedule:
      interval: "daily"
  - package-ecosystem: "bundler"
    directory: "/frontend/rails"
    schedule:
      interval: "daily"
