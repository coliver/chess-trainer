server {
  listen 80;
  listen 443 ssl http2;
  server_name knightschool.click www.knightschool.click;

  # SSL Configuration — real certs from Let's Encrypt (certbot), mounted at
  # the same paths the dev config points to for the self-signed pair.
  ssl_certificate /etc/nginx/certs/live/knightschool.click/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/live/knightschool.click/privkey.pem;

  # API proxy
  location /api/ {
    proxy_pass http://api:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Static production React build (npm run build in react/ -> react/dist).
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /htmlcov/ {
    alias /app/htmlcov/;
  }
}
