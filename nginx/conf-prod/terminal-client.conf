# Kept identical to nginx/terminal-client.conf — update both.
# Used by the bare-root redirect in default.conf's `location /` to send
# curl/wget clients to the text-mode dashboard instead of the React SPA.
map $http_user_agent $is_terminal_client {
    default 0;
    "~*curl"    1;
    "~*wget"    1;
    "~*httpie"  1;
}
