# Production config — requires a real cert to already exist at the paths
# below (see nginx/conf-bootstrap/default.conf for how to obtain the first
# one on a brand-new host).
server {
  listen 80;
  server_name knightschool.click www.knightschool.click;

  # Kept here (not just in the bootstrap config) so `certbot renew` keeps
  # working over plain HTTP without switching configs again.
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  server_name knightschool.click www.knightschool.click;

  ssl_certificate /etc/nginx/certs/live/knightschool.click/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/live/knightschool.click/privkey.pem;

  # Docker's embedded DNS. Lets /rails/ below re-resolve "rails" per request
  # instead of once at nginx startup, so a startup-order race (nginx coming
  # up before rails' network alias registers) degrades to a transient 502
  # instead of nginx refusing to start at all ("host not found in upstream").
  resolver 127.0.0.11 valid=10s;

  location /api/ {
    proxy_pass http://api:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /rails/ {
    set $rails_upstream rails;
    proxy_pass http://$rails_upstream:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_read_timeout 86400;
  }

  # Static production React build (npm run build in react/ -> react/dist).
  root /usr/share/nginx/html;
  index index.html;

  # Bare root only (exact match) — curl/wget land on the text dashboard
  # instead of the React SPA. Every other path still falls through to the
  # general location / block below, unaffected by User-Agent.
  location = / {
    if ($is_terminal_client) {
      return 302 /api/dashboard.text;
    }
    try_files $uri $uri/ /index.html;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /htmlcov/ {
    alias /app/htmlcov/;
  }
}
