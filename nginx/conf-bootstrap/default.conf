# One-time bootstrap config, used ONLY before a TLS cert exists yet.
#
# nginx refuses to start at all if `ssl_certificate` in conf-prod/default.conf
# points at a file that doesn't exist — so on a brand-new host, certbot's
# HTTP-01 challenge has nowhere to run. This config serves plain HTTP (no TLS
# directives, so nginx can start with zero certs) with just enough routing to
# pass the ACME challenge and serve the app while you obtain the first cert:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod-bootstrap.yml up -d nginx
#   sudo certbot certonly --webroot -w certbot-www -d knightschool.click
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d nginx
#
# After that first cert exists, conf-prod/default.conf handles renewals too
# (it has the same acme-challenge location), so this file is only needed once
# per host.
server {
  listen 80;
  server_name knightschool.click www.knightschool.click;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location /api/ {
    proxy_pass http://api:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }
}
